<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Board</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>Task Board</h1>
        <p class="app__subtitle">A tiny demo app for the Cloud Agent environment.</p>
      </header>

      <form id="new-task-form" class="task-form">
        <input
          id="task-input"
          class="task-form__input"
          type="text"
          placeholder="Add a new task…"
          autocomplete="off"
          required
        />
        <button class="task-form__button" type="submit">Add</button>
      </form>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state">No tasks yet. Add one above.</p>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
